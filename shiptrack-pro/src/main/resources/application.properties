spring.application.name=shiptrack-pro

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiptrack}

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


jwt.secret=${JWT_SECRET:8f3a2b91c4d67e0f1a5b8c9d2e3f4061728394a5b6c7d8e9f0a1b2c3d4e5f60}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

notification.duplicate-window-minutes=${NOTIFICATION_DUPLICATE_WINDOW_MINUTES:60}
notification.delay-risk-threshold=${NOTIFICATION_DELAY_RISK_THRESHOLD:0.7}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000